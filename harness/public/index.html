<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AI thing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{color-scheme:dark;--bg:#05070b;--panel:#0a0d13;--card:#10141b;--card2:#161b24;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--fg:#f2f4f7;--mute:#8a93a3;--dim:#5b6472;--run:#f5b642;--ok:#4ade80;--ask:#7dd3fc;--bad:#f87171}
  *{box-sizing:border-box}html,body{height:100%}[hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 Geist,Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:8px}::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.14)}
  .mono{font-family:"Geist Mono","JetBrains Mono",ui-monospace,monospace}
  button,select,textarea,input{font:inherit;color:inherit;background:transparent;border:0}
  button{cursor:pointer;border-radius:6px}button:disabled{opacity:.4;cursor:default}
  .btn{height:28px;padding:0 8px;display:inline-flex;align-items:center;gap:6px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);color:var(--mute);font-size:12px;white-space:nowrap}
  .btn:hover{background:rgba(255,255,255,.05);color:var(--fg)}
  .btn.primary{background:var(--fg);color:var(--bg);font-weight:500;box-shadow:none}.btn.primary:hover{background:#dfe4ed}
  .btn.ghost{box-shadow:none}
  .icon{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--mute)}.icon:hover{background:rgba(255,255,255,.05);color:var(--fg)}
  svg.i{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  svg.i.s{width:12px;height:12px}svg.i.l{width:16px;height:16px}
  select{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:6px;padding:3px 6px;font-size:12px;max-width:150px}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:500}
  .pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(245,182,66,.45)}50%{opacity:.75;box-shadow:0 0 0 5px rgba(245,182,66,0)}}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}.dot.running{background:var(--run)}.dot.needs_you{background:var(--ask)}.dot.completed{background:var(--ok)}.dot.failed{background:var(--bad)}.dot.in_progress,.dot.pending{background:var(--run)}
  .app{display:flex;height:100%}
  /* ---------- left ---------- */
  .left{width:276px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .apphead{height:48px;padding:0 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
  .logo{width:24px;height:24px;border-radius:6px;background:rgba(242,244,247,.9);color:var(--bg);display:grid;place-items:center;font-size:10px;font-weight:700}
  .threads{flex:1.15;min-height:0;display:flex;flex-direction:column}
  .sechead{padding:12px 12px 6px;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .tlist{flex:1;overflow-y:auto;padding:0 8px 8px}
  .tcard{display:block;border-radius:6px;padding:8px;cursor:pointer;margin-bottom:2px}
  .tcard:hover{background:rgba(255,255,255,.04)}.tcard.active{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line2)}
  .tcard .top{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);min-width:0}
  .tcard .top .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tcard .st{margin-left:auto;display:flex;align-items:center;gap:4px;flex:none}.st.running{color:var(--run)}.st.needs_you{color:var(--ask)}.st.done{color:var(--ok)}
  .tcard .title{margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .tcard .sub{margin-top:2px;font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
  .tcard .unread{width:6px;height:6px;border-radius:50%;background:rgba(242,244,247,.8);flex:none}
  .tcard.settled{padding:6px 8px}.tcard.settled .title{font-weight:400;color:rgba(242,244,247,.8);font-size:12.5px}.tcard.settled .top{color:var(--dim)}
  .chip{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:8px;font-weight:600;color:rgba(0,0,0,.8);flex:none}
  .agentbadge{font:10px/1 ui-monospace,monospace;color:#c8ced8;background:#171d27;box-shadow:inset 0 0 0 1px var(--line);border-radius:4px;padding:3px 4px;flex:none}
  .settledbtn{margin:0 8px 8px;height:28px;padding:0 8px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);border-radius:6px}.settledbtn:hover{color:var(--fg);background:rgba(255,255,255,.04)}
  .files{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .files .sechead{padding-top:10px}
  .crumbs{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--mute);padding:0 12px 4px;flex-wrap:wrap}
  .crumbs a{color:rgba(242,244,247,.85);cursor:pointer}.crumbs a:hover{text-decoration:underline}
  .flist{flex:1;overflow-y:auto;padding:0 8px 8px}
  .frow{height:24px;display:flex;align-items:center;gap:6px;padding:0 6px;border-radius:4px;color:var(--mute);cursor:pointer;font-size:12.5px}
  .frow:hover{background:rgba(255,255,255,.04)}.frow.sel{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line2)}
  .frow .n{color:rgba(242,244,247,.9);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.frow .m{font-size:10px;color:var(--dim);flex:none}
  .frow img{width:18px;height:18px;object-fit:cover;border-radius:3px;flex:none;background:#000}
  .fempty{color:var(--dim);font-size:12px;padding:12px 8px}
  .leftfoot{border-top:1px solid var(--line);padding:8px 12px;font-size:11px;color:var(--dim);display:flex;gap:8px;align-items:center;min-width:0}.leftfoot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* ---------- center ---------- */
  .center{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  .thead{height:48px;flex:none;border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;gap:12px}
  .thead h1{font-size:13px;font-weight:500;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .thead .meta{font-size:11px;color:var(--mute);white-space:nowrap}
  .thead .actions{margin-left:auto;display:flex;gap:6px;align-items:center}
  .scroll{flex:1;min-height:0;overflow-y:auto}
  .msgs{max-width:820px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:22px}
  .row{display:flex;gap:12px}
  .avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#64748b,#1e293b);flex:none;margin-top:2px}
  .avatar.agent{border-radius:6px;background:var(--fg);color:var(--bg);display:grid;place-items:center}
  .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:10px}
  .text{white-space:pre-wrap;word-break:break-word;color:rgba(242,244,247,.95)}
  .text.synthetic{color:var(--mute);font-size:12px;font-style:italic}
  .atts{display:flex;gap:6px;flex-wrap:wrap}.atts img{height:40px;width:64px;object-fit:cover;border-radius:6px;cursor:pointer;background:#000}
  .thought{color:var(--dim);font-style:italic;font-size:12px;border-left:2px solid var(--line);padding-left:10px;white-space:pre-wrap}
  .card{border:1px solid var(--line);background:var(--card);border-radius:8px}
  .card .ch{padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);font-size:12px}.card .ch b{font-weight:500}.card .ch .r{margin-left:auto;color:var(--dim)}
  .plan ul{list-style:none;margin:0;padding:8px 12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}.plan li{display:flex;gap:8px;align-items:center}.plan li.completed{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.2)}.plan li.in_progress .dot{animation:pulse 1.6s infinite}.plan li.pending{color:var(--dim)}
  details.tool{border:1px solid var(--line);background:rgba(16,20,27,.6);border-radius:6px}
  details.tool summary{list-style:none;height:32px;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);cursor:pointer}details.tool summary::-webkit-details-marker{display:none}details.tool summary:hover{color:var(--fg)}
  details.tool summary b{font-weight:500;color:rgba(242,244,247,.9);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}details.tool summary .k{color:var(--dim);margin-left:auto;flex:none}
  details.tool .chev{transition:transform .15s}details.tool[open] .chev{transform:rotate(90deg)}
  details.tool pre{margin:0;padding:8px 12px 12px;border-top:1px solid var(--line);font:11.5px/1.45 "Geist Mono",ui-monospace,monospace;color:rgba(242,244,247,.7);white-space:pre-wrap;max-height:320px;overflow:auto}
  details.tool img.toolimg{display:block;max-width:100%;max-height:360px;border-radius:6px;margin:0 12px 12px;cursor:pointer}
  .ask{border:1px solid rgba(125,211,252,.3);background:rgba(125,211,252,.06);border-radius:8px}
  .ask .ch{padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(125,211,252,.2);font-size:12px;color:var(--ask);font-weight:500}
  .ask .cb{padding:12px;display:flex;flex-direction:column;gap:10px}.ask pre{margin:0;font:11.5px/1.4 "Geist Mono",ui-monospace,monospace;color:var(--mute);white-space:pre-wrap;max-height:200px;overflow:auto}
  .opts{display:flex;gap:6px;flex-wrap:wrap}.opts .ans{color:var(--dim);font-size:12px}
  .auth{border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.06);border-radius:8px}.auth .ch{color:var(--bad)}.auth code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;font-family:"Geist Mono",ui-monospace,monospace;font-size:12px}
  .sys{color:var(--dim);font-size:11.5px;text-align:center}
  /* composer */
  .composer{flex:none;border-top:1px solid var(--line);background:var(--panel)}
  .cwrap{max-width:820px;margin:0 auto;padding:12px 24px}
  #queue{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}#queue:empty{display:none}
  .qitem{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;background:var(--card);border:1px dashed var(--line2);border-radius:8px;padding:5px 10px;font-size:12px}
  .qitem .lbl{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.qitem .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(242,244,247,.9)}
  .box{border-radius:12px;border:1px solid var(--line2);background:var(--card);transition:border-color .15s}.box:focus-within{border-color:rgba(255,255,255,.25)}.box.drop{border-color:var(--ask);border-style:dashed}
  .chips{padding:8px 12px 0;display:flex;gap:6px;flex-wrap:wrap}.chips:empty{display:none}
  .achip{height:24px;padding:0 8px 0 4px;border-radius:6px;background:rgba(255,255,255,.06);display:flex;align-items:center;gap:6px;font-size:11.5px;max-width:240px}.achip img{width:16px;height:16px;border-radius:3px;object-fit:cover}.achip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.achip button{padding:0;color:var(--mute);display:grid;place-items:center}
  textarea{width:100%;resize:none;outline:none;padding:8px 12px;background:transparent;min-height:56px;display:block}textarea::placeholder{color:var(--dim)}
  .tools{padding:0 8px 8px;display:flex;align-items:center;gap:4px;color:var(--mute)}.tools .sp{flex:1}
  .hint{margin-top:6px;padding:0 4px;display:flex;gap:12px;font-size:11px;color:var(--dim)}.hint .busy{color:var(--run)}.hint .r{margin-left:auto;white-space:nowrap}
  /* ---------- right ---------- */
  .right{width:384px;flex:none;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .tabs{height:48px;padding:0 12px;display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);font-size:12px}
  .tab{height:28px;padding:0 10px;border-radius:6px;color:var(--mute)}.tab:hover{color:var(--fg);background:rgba(255,255,255,.05)}.tab.on{background:rgba(255,255,255,.08);color:var(--fg);font-weight:500}
  .rbody{flex:1;min-height:0;overflow-y:auto}
  .preview{padding:12px}.preview .big{width:100%;aspect-ratio:16/10;object-fit:contain;border-radius:8px;background:#000;box-shadow:inset 0 0 0 1px var(--line);display:block;cursor:zoom-in}
  .preview .nm{margin-top:10px;font-family:"Geist Mono",ui-monospace,monospace;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview .nm b{font-weight:500}
  .preview .sm{font-size:11px;color:var(--mute);margin-top:2px}
  .acts{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px}.acts .btn{height:32px;justify-content:center}
  dl.gen{margin:0;padding:0 12px 12px;display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:12px}dl.gen dt{color:var(--dim)}dl.gen dd{margin:0;word-break:break-word;white-space:pre-wrap}
  details.sec{border-top:1px solid var(--line)}details.sec summary{list-style:none;height:36px;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);cursor:pointer}details.sec summary::-webkit-details-marker{display:none}details.sec summary b{font-weight:500;color:rgba(242,244,247,.9)}details.sec .chev{transition:transform .15s}details.sec[open] .chev{transform:rotate(90deg)}
  .strip{display:flex;gap:6px;padding:0 12px 12px;overflow-x:auto}.strip .v{flex:none;width:64px;cursor:pointer;text-align:center;font:10px/1.4 "Geist Mono",ui-monospace,monospace;color:var(--mute)}.strip .v img{width:64px;height:64px;object-fit:cover;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);display:block;background:#000}.strip .v.sel img{outline:2px solid var(--fg);outline-offset:1px}.strip .v.cur{color:var(--ok)}
  .rempty{padding:24px 16px;color:var(--dim);font-size:12px;text-align:center}
  .subtabs{display:flex;gap:2px;padding:8px 12px 0;flex-wrap:wrap}.subtabs button{height:24px;padding:0 8px;border-radius:6px;font-size:11.5px;color:var(--mute)}.subtabs button:hover{color:var(--fg);background:rgba(255,255,255,.05)}.subtabs button.on{background:rgba(255,255,255,.08);color:var(--fg)}.subtabs button .n{color:var(--dim);margin-left:4px}
  .subhint{padding:6px 12px 0;font-size:11px;color:var(--dim)}
  .brows{padding:8px 12px 12px;display:flex;flex-direction:column;gap:2px}
  .star{color:var(--dim)}.star.on{color:var(--run)}
  .tile .star{position:absolute;bottom:22px;right:4px;width:20px;height:20px;display:grid;place-items:center;background:rgba(0,0,0,.7);border-radius:4px;opacity:0}.tile:hover .star,.tile .star.on{opacity:1}
  pre.brief{margin:0;padding:12px;font:12px/1.5 "Geist Mono",ui-monospace,monospace;color:rgba(242,244,247,.85);white-space:pre-wrap;word-break:break-word}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px}
  .tile{position:relative;min-width:0;cursor:pointer;font-size:10.5px;color:var(--mute)}.tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#000;box-shadow:inset 0 0 0 1px var(--line);display:block}.tile.sel img{outline:2px solid var(--fg);outline-offset:1px}.tile div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
  .tile .ver{position:absolute;top:4px;left:4px;font:9px/1.5 "Geist Mono",ui-monospace,monospace;background:rgba(0,0,0,.7);color:#e5e9f0;border-radius:3px;padding:0 4px}
  .tile .att{position:absolute;top:3px;right:3px;width:20px;height:20px;display:grid;place-items:center;background:rgba(0,0,0,.7);border-radius:4px;color:#fff;opacity:0}.tile:hover .att{opacity:1}
  .tile .fam{position:absolute;bottom:22px;left:4px;display:flex;align-items:center;gap:2px;font:9px/1.5 "Geist Mono",ui-monospace,monospace;background:rgba(0,0,0,.7);color:#e5e9f0;border-radius:3px;padding:0 4px}.tile .fam svg{width:10px;height:10px}
  /* lineage tree */
  .lineage{padding:0 12px 12px;display:flex;flex-direction:column;gap:2px}
  .ln{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px;border-radius:6px;cursor:pointer;font-size:11.5px;color:var(--mute);position:relative;min-width:0}.ln:hover{background:rgba(255,255,255,.04)}.ln.sel{background:rgba(255,255,255,.08);color:var(--fg)}
  .ln img,.ln .ph{width:36px;height:36px;flex:none;object-fit:cover;border-radius:5px;background:#000;box-shadow:inset 0 0 0 1px var(--line);display:block}.ln .ph{display:grid;place-items:center;font-size:9px;background:var(--card)}
  .ln.inf img,.ln.inf .ph{opacity:.55;box-shadow:inset 0 0 0 1px transparent;outline:1px dashed var(--dim);outline-offset:-1px}
  .ln .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.ln .t b{font:11.5px "Geist Mono",ui-monospace,monospace;font-weight:500;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ln .t span{font-size:10.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ln.cur .t b::after{content:" current";color:var(--ok);font-size:9.5px;font-weight:400}.ln .k{flex:none;font:9.5px "Geist Mono",ui-monospace,monospace;color:var(--dim);background:rgba(255,255,255,.05);border-radius:3px;padding:0 5px;line-height:16px}
  .ln .use,.ln .unl{flex:none;height:22px;padding:0 7px;border-radius:5px;font-size:10.5px;color:var(--mute);background:rgba(255,255,255,.06);opacity:0}.ln:hover .use,.ln:hover .unl{opacity:1}.ln .use:hover,.ln .unl:hover{color:var(--fg);background:rgba(255,255,255,.12)}
  .ln .tw{flex:none;width:6px;align-self:stretch;border-left:1px solid var(--line);margin-left:4px}.ln .tw.dash{border-left-style:dashed}
  /* fullscreen viewer */
  .viewer{position:fixed;inset:0;background:rgba(3,5,8,.94);display:flex;flex-direction:column;z-index:10}
  .viewer .top{display:flex;align-items:center;gap:10px;padding:10px 14px;color:var(--mute);font-size:12px}.viewer .top b{color:var(--fg);font-weight:500}.viewer .top .x{margin-left:auto}
  .viewer .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 16px 16px}.viewer .stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
  @media(max-width:1180px){.right{width:320px}}@media(max-width:980px){.right{display:none}}
</style></head>
<body>
<div class="app">
  <aside class="left">
    <div class="apphead"><span class="logo">AI</span><span style="flex:1;font-weight:500">AI thing</span><span id="ws" class="dot" title="connecting"></span></div>
    <div class="threads">
      <div class="sechead"><span class="label">Threads</span><span style="display:flex;gap:4px;align-items:center"><select id="agent" title="Agent for new threads"><option value="claude">Claude Code</option><option value="codex">Codex</option></select><button class="icon" id="new" title="New thread in the selected project"><svg class="i l"><use href="#i-pen"/></svg></button></span></div>
      <div class="tlist" id="threads"></div>
      <button class="settledbtn" id="settledbtn"><span>Settled <span id="settledn" style="color:var(--dim)"></span></span><svg class="i" style="margin-left:auto" id="settledchev"><use href="#i-down"/></svg></button>
    </div>
    <div class="files">
      <div class="sechead"><span style="display:flex;gap:6px;align-items:center;min-width:0"><span class="label">Files</span><span style="color:var(--dim)">·</span><select id="project" title="Project"></select></span><span style="display:flex;gap:2px"><button class="icon" id="newproject" title="New project"><svg class="i"><use href="#i-folderplus"/></svg></button><button class="icon" id="uploadbtn" title="Upload images"><svg class="i"><use href="#i-upload"/></svg></button><input type="file" id="filein" accept="image/*" multiple hidden></span></div>
      <div class="crumbs" id="crumbs"></div>
      <div class="flist" id="flist"></div>
    </div>
    <div class="leftfoot"><span id="wsdir" title=""></span></div>
  </aside>

  <main class="center">
    <header class="thead"><span class="dot" id="hdot"></span><h1 id="htitle">No thread</h1><span class="meta" id="hmeta"></span>
      <div class="actions"><button class="btn" id="cancel" disabled><svg class="i"><use href="#i-square"/></svg>Stop</button><button class="icon" id="del" title="Delete thread" disabled><svg class="i"><use href="#i-trash"/></svg></button></div></header>
    <div class="scroll" id="scroll"><div class="msgs" id="log"></div></div>
    <div class="composer"><div class="cwrap">
      <div id="queue"></div>
      <div class="box" id="box">
        <div class="chips" id="chips"></div>
        <textarea id="text" rows="2" placeholder="Message the agent… drop or paste images to attach" disabled></textarea>
        <div class="tools">

</div>

<script>
const $=s=>document.querySelector(s);const log=$('#log'),scrollEl=$('#scroll'),threadList=$('#threads');
const ic=(n,cls='')=>`<svg class="i ${cls}"><use href="#${n}"/></svg>`;
let sock,currentThreadId=null,currentThread=null,agentEl=null,tools=new Map(),perms=new Map(),planEl=null;
const threads=new Map(),projects=new Map();
let queue=[],attachments=[];
let initialView=new URLSearchParams(location.search).get('view');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const send=m=>{if(sock?.readyState===WebSocket.OPEN)sock.send(JSON.stringify(m))};
const isBusy=t=>!!t&&(t.status==='running'||t.status==='needs_you');
const AGENT={claude:'Claude Code',codex:'Codex'};
const scrollDown=()=>{scrollEl.scrollTop=scrollEl.scrollHeight};
// project chip colours
const PAL=[['#f2a15c','#7a3c26'],['#5cc8f2','#26507a'],['#b28cf2','#4a2a7a'],['#8cf2b2','#2a7a4a'],['#f28c8c','#7a2a2a'],['#f2e28c','#7a6a2a']];
function chipFor(pid){const p=projects.get(pid);const name=p?.name||'?';let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))>>>0;const [a,b]=PAL[h%PAL.length];const ini=name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();return `<span class="chip" style="background:linear-gradient(135deg,${a},${b})">${esc(ini)}</span>`}
function setControls(){
  const busy=isBusy(currentThread);
  $('#cancel').disabled=!busy;$('#del').disabled=!currentThread;$('#send').disabled=!currentThread;$('#text').disabled=!currentThread;
  $('#send').firstChild.textContent=busy?'Queue':'Send';$('#now').hidden=!busy;
  $('#busyhint').textContent=busy?'Agent is working: Enter queues, Send now interrupts.':'';$('#idlehint').hidden=busy;
  const t=currentThread;$('#hdot').className='dot '+(t?t.status:'')+(t?.status==='running'?' pulse':'');
  $('#htitle').textContent=t?(t.title||'Untitled'):'No thread';
  $('#hmeta').textContent=t?`· ${AGENT[t.agent]} · ${projects.get(t.project_id)?.name??''} · ${t.status==='needs_you'?'needs you':t.status==='running'?'working':'idle'}`:'';
  $('#agentlbl').textContent=t?AGENT[t.agent]:'';
}
// ---- projects ----
function renderProjects(){
  const sel=$('#project');const prev=sel.value;sel.innerHTML='';
  for(const p of [...projects.values()].sort((a,b)=>a.name.localeCompare(b.name))){const o=document.createElement('option');o.value=p.id;o.textContent=p.name;o.title=p.path;sel.appendChild(o)}
  if(projects.has(prev))sel.value=prev;else if(currentThread&&projects.has(currentThread.project_id))sel.value=currentThread.project_id;
  renderThreads();refreshFiles();
}
const shownProjectId=()=>currentThread?currentThread.project_id:$('#project').value||null;
// ---- threads ----
const isActive=t=>t.status!=='idle'||!!t.unread||t.id===currentThreadId;
let settledOpen=localStorage.getItem('settledOpen')==='1';
const ago=ts=>{const s=(Date.now()-ts)/1000;return s<60?'now':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d'};
function tcard(t,settled){
  const row=document.createElement('a');row.className='tcard'+(settled?' settled':'')+(t.id===currentThreadId?' active':'');row.title=t.title||'Untitled';row.tabIndex=0;
  const st=t.status==='running'?`<span class="st running"><span class="dot running pulse"></span>Working</span>`:t.status==='needs_you'?`<span class="st needs_you"><span class="dot needs_you"></span>Needs you</span>`:`<span class="st" style="color:var(--dim)">${ago(t.updated_at)}</span>`;
  row.innerHTML=`<div class="top">${chipFor(t.project_id)}<span class="pn">${esc(projects.get(t.project_id)?.name??'')}</span>${st}${t.unread&&t.status==='idle'?'<span class="unread" title="unread"></span>':''}</div><div class="title">${esc(t.title||'Untitled')}</div>${settled?'':`<div class="sub"><span class="agentbadge">${t.agent==='claude'?'CC':'CX'}</span><span>${esc(AGENT[t.agent])}</span></div>`}`;
  row.onclick=()=>openThread(t.id);row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openThread(t.id)}};
  return row;
}
function renderThreads(){
  threadList.innerHTML='';
  const all=[...threads.values()].sort((a,b)=>b.updated_at-a.updated_at);const active=all.filter(isActive),settled=all.filter(t=>!isActive(t));
  if(!active.length&&!settled.length)threadList.innerHTML='<div class="fempty">No threads yet. Pick a project and press the new-thread button.</div>';
  for(const t of active)threadList.appendChild(tcard(t,false));
  if(settledOpen&&settled.length){const h=document.createElement('div');h.className='label';h.style.padding='10px 8px 4px';h.textContent='Settled';threadList.appendChild(h);for(const t of settled)threadList.appendChild(tcard(t,true))}
  $('#settledn').textContent=`(${settled.length})`;$('#settledchev').innerHTML=`<use href="#${settledOpen?'i-down':'i-right'}"/>`;$('#settledbtn').hidden=!settled.length;
}
$('#settledbtn').onclick=()=>{settledOpen=!settledOpen;localStorage.setItem('settledOpen',settledOpen?'1':'0');renderThreads()};
function resetLog(){log.innerHTML='';tools.clear();perms.clear();planEl=null;agentEl=null}
function openThread(id){send({type:'open_thread',threadId:id})}
function showThread(thread,events,q){
  const projectChanged=shownProjectId()!==thread.project_id;
  currentThreadId=thread.id;currentThread=thread;threads.set(thread.id,thread);resetLog();
  history.replaceState(null,'',`?thread=${encodeURIComponent(thread.id)}`);
  for(const event of events)renderEvent(event);
  queue=q||[];renderQueue();attachments=[];renderChips();
  $('#tid').textContent='thread '+thread.id.slice(0,8);
  if(projects.has(thread.project_id))$('#project').value=thread.project_id;
  renderThreads();setControls();$('#text').focus();markSeen();
  if(projectChanged){filesDir='';selected=null;renderInspect()}refreshFiles();
  if(initialView){const {path,version}=splitRef(initialView);initialView=null;selectFile(thread.project_id,path,version)}
  scrollDown();
}
// ---- queue ----
function renderQueue(){
  const q=$('#queue');q.innerHTML='';
  for(const item of queue){const d=document.createElement('div');d.className='qitem';
    d.innerHTML=`<span class="lbl">${item.synthetic?'harness':'queued'}</span><span class="txt" title="${esc(item.text)}">${esc(item.text.split(/\r?\n/)[0])}${item.attachments?.length?` <span style="color:var(--dim)">+${item.attachments.length} image${item.attachments.length>1?'s':''}</span>`:''}</span><button class="btn qnow">Send now</button><button class="icon del" title="Remove">${ic('i-x')}</button>`;
    d.querySelector('.qnow').onclick=()=>send({type:'queue_send_now',id:item.id});d.querySelector('.del').onclick=()=>send({type:'queue_remove',id:item.id});q.appendChild(d)}
}
// ---- files (left list) + browse (right grid) ----
let filesDir='',filesProjectShown=null,filesReq=0,listing=null,selected=null;
const human=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB';
const rawUrl=(pid,path,v,version)=>`/api/projects/${encodeURIComponent(pid)}/raw?path=${encodeURIComponent(path)}${version?'&version='+version:''}${v?'&v='+Math.round(v):''}`;
const splitRef=ref=>{const m=/^(.*)@(\d+)$/.exec(ref);return m?{path:m[1],version:Number(m[2])}:{path:ref}};
const isImg=e=>e.type==='file'&&/^image\/(png|jpeg|webp|gif)$/.test(e.mime||'');
const isImgPath=p=>/\.(png|jpe?g|webp|gif)$/i.test(p);
const joinDir=n=>filesDir?filesDir+'/'+n:n;
async function refreshFiles(){
  const pid=shownProjectId();const p=pid&&projects.get(pid);
  if(pid!==filesProjectShown){filesDir='';filesProjectShown=pid}
  const crumbs=$('#crumbs'),list=$('#flist');
  $('#wsdir').textContent=p?p.path:'';$('#wsdir').title=p?p.path:'';
  refreshIndex();
  if(!p){crumbs.innerHTML='';list.innerHTML='<div class="fempty">No project. Create one with the folder button.</div>';renderBrowse();return}
  const segs=filesDir?filesDir.split('/'):[];crumbs.innerHTML='';
  const root=document.createElement('a');root.textContent=p.name;root.onclick=()=>{filesDir='';refreshFiles()};crumbs.appendChild(root);
  segs.forEach((s,i)=>{crumbs.insertAdjacentHTML('beforeend','<span style="color:var(--dim)">/</span>');const a=document.createElement('a');a.textContent=s;a.onclick=()=>{filesDir=segs.slice(0,i+1).join('/');refreshFiles()};crumbs.appendChild(a)});
  const req=++filesReq;let data;
  try{const r=await fetch(`/api/projects/${encodeURIComponent(pid)}/files?path=${encodeURIComponent(filesDir)}`);data=await r.json();if(!r.ok)throw new Error(data.error||r.status)}
  catch(e){if(req===filesReq)list.innerHTML=`<div class="fempty">${esc(e.message||e)}</div>`;return}
  if(req!==filesReq)return;
  const imgBases=new Set(data.entries.filter(isImg).map(e=>e.name.replace(/\.[^.]+$/,'')));
  listing={pid,dir:filesDir,entries:data.entries.filter(e=>!(e.type==='file'&&/\.json$/i.test(e.name)&&imgBases.has(e.name.replace(/\.json$/i,''))))};
  list.innerHTML='';
  if(!listing.entries.length)list.innerHTML='<div class="fempty">Empty folder</div>';
  for(const e of listing.entries){const d=document.createElement('div');const path=joinDir(e.name);const img=isImg(e);
    d.className='frow'+(selected&&selected.pid===pid&&selected.path===path?' sel':'');
    d.innerHTML=e.type==='dir'?`${ic('i-right','s')}${ic('i-folder')}<span class="n">${esc(e.name)}</span>`:img?`<img loading="lazy" src="${rawUrl(pid,path,e.mtime)}" alt=""><span class="n">${esc(e.name)}</span><span class="m">${e.versions>1?'v'+e.current:''}</span>`:`${ic('i-file')}<span class="n">${esc(e.name)}</span><span class="m">${human(e.size)}</span>`;
    d.onclick=()=>{if(e.type==='dir'){filesDir=path;refreshFiles()}else if(img||/\.(md|txt|json|csv|svg|html|css|js|ts)$/i.test(e.name))selectFile(pid,path);else window.open(rawUrl(pid,path),'_blank')};
    list.appendChild(d)}
  renderBrowse();
}
// Derived views over the version index: no folder taxonomy is imposed on disk.
let index=null,indexPid=null,browseTab=new URLSearchParams(location.search).get('browse')||localStorage.getItem('browseTab')||'folder';
if(new URLSearchParams(location.search).get('browse'))setTimeout(()=>{document.querySelector('.tab[data-tab=browse]')?.click()},1500);
const VIEWS=[['folder','Folder','Images in the folder open on the left.'],['thread','This thread','Files this thread wrote or generated.'],['outputs','Outputs','Images produced by generate or edit.'],['refs','Refs','Images used as references, and uploads.'],['picks','Picks','Starred files.'],['brief','Brief','Markdown and text files at the project root: the agent reads these.']];
async function refreshIndex(){const pid=shownProjectId();if(!pid){index=null;indexPid=null;renderBrowse();return}
  try{const r=await fetch(`/api/projects/${encodeURIComponent(pid)}/index`);if(r.ok){index=await r.json();indexPid=pid}}catch{}
  renderBrowse()}
function viewFiles(tab){const f=(index?.files||[]).filter(e=>e.exists);
  switch(tab){case 'thread':return f.filter(e=>currentThreadId&&e.threads.includes(currentThreadId));case 'outputs':return f.filter(e=>e.image&&e.kinds.some(k=>k==='generate'||k==='edit'));case 'refs':return f.filter(e=>e.image&&(e.usedAsRef||e.kinds.includes('upload')));case 'picks':return f.filter(e=>e.starred);default:return []}}
function tileFor(pid,path,opts){const t=document.createElement('div');t.className='tile'+(selected&&selected.path===path?' sel':'');t.title=path;
  t.innerHTML=`<img loading="lazy" src="${rawUrl(pid,path,opts.mtime)}" alt="">${opts.versions>1?`<span class="ver">v${opts.current}</span>`:''}${opts.family>1?`<span class="fam" title="${opts.family} related files">${ic('i-branch')}${opts.family}</span>`:''}<button class="att" title="Attach to message">+</button><button class="star${opts.starred?' on':''}" title="${opts.starred?'Unstar':'Star as a pick'}">${ic('i-star','s')}</button><div>${esc(path.split('/').pop())}</div>`;
  t.onclick=()=>selectFile(pid,path);t.querySelector('.att').onclick=ev=>{ev.stopPropagation();addAttachment(pid,opts.current?path+'@'+opts.current:path)};
  t.querySelector('.star').onclick=ev=>{ev.stopPropagation();send({type:'star',projectId:pid,path,starred:!opts.starred})};return t}
function renderBrowse(){
  const b=$('#browse');b.innerHTML='';const pid=shownProjectId();
  if(!pid){b.innerHTML='<div class="rempty">No project selected.</div>';return}
  const counts={folder:listing?listing.entries.filter(isImg).length:0,thread:viewFiles('thread').length,outputs:viewFiles('outputs').length,refs:viewFiles('refs').length,picks:viewFiles('picks').length,brief:index?.briefs?.length||0};
  const st=document.createElement('div');st.className='subtabs';
  for(const [id,label] of VIEWS){const bt=document.createElement('button');bt.className=id===browseTab?'on':'';bt.innerHTML=`${label}<span class="n">${counts[id]}</span>`;bt.onclick=()=>{browseTab=id;localStorage.setItem('browseTab',id);renderBrowse()};st.appendChild(bt)}
  b.appendChild(st);const hint=document.createElement('div');hint.className='subhint';hint.textContent=VIEWS.find(v=>v[0]===browseTab)[2];b.appendChild(hint);
  if(browseTab==='folder'){
    if(!listing){b.insertAdjacentHTML('beforeend','<div class="rempty">No folder open.</div>');return}
    const imgs=listing.entries.filter(isImg);if(!imgs.length){b.insertAdjacentHTML('beforeend','<div class="rempty">No images in this folder.</div>');return}
    const g=document.createElement('div');g.className='grid';const byPath=new Map((index?.files||[]).map(e=>[e.path,e]));
    for(const e of imgs){const path=(listing.dir?listing.dir+'/':'')+e.name;const ix=byPath.get(path);g.appendChild(tileFor(listing.pid,path,{mtime:e.mtime,versions:e.versions,current:e.current,starred:!!ix?.starred,family:ix?.familySize}))}
    b.appendChild(g);return}
  if(browseTab==='brief'){
    const briefs=index?.briefs||[];if(!briefs.length){b.insertAdjacentHTML('beforeend','<div class="rempty">No markdown or text files at the project root. Add an AGENT.md with instructions for the agents.</div>');return}
    const rows=document.createElement('div');rows.className='brows';
    for(const f of briefs){const d=document.createElement('div');d.className='frow'+(selected&&selected.path===f.name?' sel':'');d.innerHTML=`${ic('i-file')}<span class="n">${esc(f.name)}</span><span class="m">${human(f.size)}</span>`;d.onclick=()=>showBrief(pid,f.name);rows.appendChild(d)}
    b.appendChild(rows);return}
  const files=viewFiles(browseTab);if(!files.length){b.insertAdjacentHTML('beforeend','<div class="rempty">Nothing here yet.</div>');return}
  const g=document.createElement('div');g.className='grid';const rows=document.createElement('div');rows.className='brows';
  for(const e of files){if(e.image)g.appendChild(tileFor(pid,e.path,{versions:e.versions,current:e.current,starred:e.starred,family:e.familySize}));
    else{const d=document.createElement('div');d.className='frow'+(selected&&selected.path===e.path?' sel':'');d.innerHTML=`${ic('i-file')}<span class="n" title="${esc(e.path)}">${esc(e.path)}</span><span class="m">${e.versions>1?'v'+e.current:''}</span>`;d.onclick=()=>showBrief(pid,e.path);rows.appendChild(d)}}
  if(g.children.length)b.appendChild(g);if(rows.children.length)b.appendChild(rows);
}
async function showBrief(pid,path){
  let manifest=null;try{const r=await fetch(`/api/projects/${encodeURIComponent(pid)}/versions?path=${encodeURIComponent(path)}`);if(r.ok)manifest=await r.json()}catch{}
  let text='';try{text=await (await fetch(rawUrl(pid,path,Date.now()))).text()}catch(e){text=String(e)}
  selected={pid,path,manifest,family:manifest?await fetchFamily(pid,path):null,sel:manifest?.current??null,text};
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab==='inspect'));$('#inspect').hidden=false;$('#browse').hidden=true;renderInspect();renderBrowse();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));$('#inspect').hidden=t.dataset.tab!=='inspect';$('#browse').hidden=t.dataset.tab!=='browse'});
// ---- inspector ----
const fmtTime=iso=>{const d=new Date(iso);return isNaN(d)?iso:d.toLocaleString()};
async function fetchFamily(pid,path){try{const r=await fetch(`/api/projects/${encodeURIComponent(pid)}/family?path=${encodeURIComponent(path)}`);return r.ok?await r.json():null}catch{return null}}
async function selectFile(pid,path,version){
  let manifest=null,family=null;
  try{const [mr,fr]=await Promise.all([fetch(`/api/projects/${encodeURIComponent(pid)}/versions?path=${encodeURIComponent(path)}`),fetchFamily(pid,path)]);if(mr.ok)manifest=await mr.json();family=fr}catch{}
  selected={pid,path,manifest,family,sel:version??manifest?.current??null};
  if(!isImgPath(path)){try{selected.text=await (await fetch(rawUrl(pid,path,null,selected.sel))).text()}catch{}}
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab==='inspect'));$('#inspect').hidden=false;$('#browse').hidden=true;
  renderInspect();refreshFiles();
}
function renderInspect(){
  const box=$('#inspect');
  if(!selected){box.innerHTML='<div class="rempty">Select an image in Files or Browse to inspect it.</div>';return}
  const {pid,path,manifest,sel}=selected;const versions=manifest?.versions??[];const current=manifest?.current??null;const v=versions.find(x=>x.n===sel);const src=rawUrl(pid,path,v?null:Date.now(),v?sel:undefined);const s=v?.source||{};
  const isText=selected.text!=null;const starred=!!manifest?.starred;
  box.innerHTML=`<div class="preview">${isText?`<pre class="brief" style="max-height:320px;overflow:auto;background:var(--card);border-radius:8px;box-shadow:inset 0 0 0 1px var(--line)">${esc(selected.text)}</pre>`:`<img class="big" src="${src}" alt="" title="Open fullscreen">`}<div class="nm">${esc(path.includes('/')?path.slice(0,path.lastIndexOf('/')+1):'')}<b>${esc(path.split('/').pop())}</b></div>
    <div class="sm">${v?`v${v.n}${v.n===current?' (current)':''} · `:''}${v?.width?`${v.width} × ${v.height} · `:''}${v?human(v.size)+' · ':''}${v?esc(fmtTime(v.createdAt)):'not versioned yet'}</div>
    <div class="acts">${isText?`<button class="btn" id="istar">${ic('i-star')}${starred?'Unstar':'Star'}</button>`:`<button class="btn primary" id="iattach">${ic('i-clip')}Attach to message</button>`}${isText?'':`<button class="btn" id="istar" title="Starred files show under Picks">${ic('i-star')}${starred?'Unstar':'Star'}</button>`}${v&&v.n!==current?`<button class="btn" id="irestore">Restore as new version</button>`:`<button class="btn" id="ifull">${ic('i-max')}Fullscreen</button>`}<a class="btn" href="${rawUrl(pid,path,null,v?sel:undefined)}" target="_blank" style="text-decoration:none">Open file</a>${v&&v.n!==current?`<button class="btn" id="ifull2">${ic('i-max')}Fullscreen</button>`:''}</div></div>
    ${versions.length?`<details class="sec" open><summary>${ic('i-right','s chev')}<b>Versions</b><span style="color:var(--dim)">${versions.length}</span></summary><div class="strip">${versions.map(x=>`<div class="v${x.n===sel?' sel':''}${x.n===current?' cur':''}" data-n="${x.n}">${isText?`<div style="width:64px;height:64px;border-radius:6px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;font-size:11px">${human(x.size)}</div>`:`<img loading="lazy" src="${rawUrl(pid,path,null,x.n)}" alt="">`}<div>v${x.n} ${esc(x.source?.kind||'')}</div></div>`).join('')}</div></details>`:''}
    ${renderLineage()}
    ${v?`<details class="sec" open><summary>${ic('i-right','s chev')}<b>Generation</b></summary><dl class="gen"><dt>Source</dt><dd>${esc(s.kind)}${s.from?' of '+esc(String(s.from).replace(/^(\d+)$/,'v$1')):''}</dd>${v.parents?.length?`<dt>Derived from</dt><dd>${v.parents.map(r=>`<a class="pref" style="color:inherit" href="?view=${encodeURIComponent(r)}" data-ref="${esc(r)}">${esc(r)}</a>`).join('\n')}${v.inferred?' <i style="color:var(--dim)">(inferred from the filename or identical bytes)</i>':''}</dd>`:''}${s.model?`<dt>Model</dt><dd>${esc(s.model)}${s.aspectRatio?' · '+esc(s.aspectRatio):''}${s.resolution?' · '+esc(s.resolution):''}</dd>`:''}${s.prompt?`<dt>Prompt</dt><dd>${esc(s.prompt)}</dd>`:''}${s.references?.length?`<dt>Refs</dt><dd>${s.references.map(esc).join('\n')}</dd>`:''}${s.originalName?`<dt>Uploaded as</dt><dd>${esc(s.originalName)}</dd>`:''}${s.durationMs?`<dt>Took</dt><dd>${(s.durationMs/1000).toFixed(1)}s</dd>`:''}${v.threadId?`<dt>Thread</dt><dd><a style="color:inherit" href="?thread=${esc(v.threadId)}">${esc(v.threadId.slice(0,8))}</a></dd>`:''}</dl></details>`:''}`;
  const ia=box.querySelector('#iattach');if(ia)ia.onclick=()=>addAttachment(pid,v?`${path}@${v.n}`:path);
  box.querySelector('#istar').onclick=()=>send({type:'star',projectId:pid,path,starred:!starred});
  const rs=box.querySelector('#irestore');if(rs)rs.onclick=()=>send({type:'restore_version',projectId:pid,path,version:sel,threadId:currentThreadId||undefined});
  box.querySelectorAll('a.pref').forEach(a=>a.onclick=e=>{e.preventDefault();const {path:pp,version:pv}=splitRef(a.dataset.ref);selectFile(pid,pp,pv)});
  box.querySelectorAll('.ln').forEach(d=>{d.onclick=()=>selectFile(pid,d.dataset.path,Number(d.dataset.n));
    const use=d.querySelector('.use');if(use)use.onclick=ev=>{ev.stopPropagation();send({type:'pick',projectId:pid,from:d.dataset.ref,to:path,threadId:currentThreadId||undefined})};
    const unl=d.querySelector('.unl');if(unl)unl.onclick=ev=>{ev.stopPropagation();send({type:'relink',projectId:pid,path:d.dataset.path,version:Number(d.dataset.n),parents:[]})}});
  for(const id of ['#ifull','#ifull2']){const b=box.querySelector(id);if(b)b.onclick=()=>openViewer(src,path)}
  const big=box.querySelector('.big');if(big)big.onclick=()=>openViewer(src,path);
  box.querySelectorAll('.strip .v').forEach(d=>d.onclick=async()=>{selected.sel=Number(d.dataset.n);if(isText){try{selected.text=await (await fetch(rawUrl(pid,path,null,selected.sel))).text()}catch{}}renderInspect()});
}
// The family is a DAG of version refs; draw it as a tree from the roots (a node with two parents hangs under the first one it was listed with).
function renderLineage(){
  const fam=selected?.family;if(!fam||!fam.nodes||fam.nodes.length<2)return '';
  const {pid,path,sel}=selected;const byRef=new Map(fam.nodes.map(n=>[n.ref,n]));const kids=new Map();const placed=new Set();
  for(const n of fam.nodes){const p=(n.parents||[]).find(r=>byRef.has(r));if(p){if(!kids.has(p))kids.set(p,[]);kids.get(p).push(n)}}
  const roots=fam.nodes.filter(n=>!(n.parents||[]).some(r=>byRef.has(r)));
  const paths=new Set(fam.nodes.map(n=>n.path)).size;
  const row=(n,depth)=>{if(placed.has(n.ref))return '';placed.add(n.ref);
    const isSel=n.path===path&&n.n===sel;const img=isImgPath(n.path);const other=n.path!==path;
    const twigs=Array.from({length:depth},(_,i)=>`<span class="tw${i===depth-1&&n.inferred?' dash':''}"></span>`).join('');
    const snippet=n.prompt?n.prompt.replace(/\s+/g,' ').slice(0,90):n.kind==='upload'?'uploaded':n.kind==='adopt'?'found on disk':n.kind==='external'?'edited outside the harness':n.kind==='agent_write'?'written by the agent':n.kind==='restore'||n.kind==='pick'?`copied from ${(n.parents?.[0]||'').split('/').pop()}`:'';
    return `<div class="ln${isSel?' sel':''}${n.current?' cur':''}${n.inferred?' inf':''}" data-ref="${esc(n.ref)}" data-path="${esc(n.path)}" data-n="${n.n}" title="${esc(n.ref)}${n.inferred?' — link inferred from the filename or identical bytes':''}">${twigs}${img?`<img loading="lazy" src="${rawUrl(pid,n.path,null,n.n)}" alt="">`:`<span class="ph">${human(n.size||0)}</span>`}<div class="t"><b>${esc(n.path.split('/').pop())}<i style="color:var(--dim);font-style:normal"> v${n.n}</i></b><span>${esc(snippet)}</span></div><span class="k">${esc(n.kind)}</span>${n.inferred?`<button class="unl" title="Detach this inferred link">unlink</button>`:''}${other&&img?`<button class="use" title="Copy this version onto ${esc(path.split('/').pop())} as its next version">use</button>`:''}</div>`+
      (kids.get(n.ref)||[]).map(c=>row(c,depth+1)).join('')};
  const html=roots.map(r=>row(r,0)).join('')+fam.nodes.filter(n=>!placed.has(n.ref)).map(n=>row(n,0)).join('');
  return `<details class="sec" open><summary>${ic('i-right','s chev')}<b>Lineage</b><span style="color:var(--dim)">${paths} file${paths>1?'s':''} · ${fam.nodes.length} versions</span></summary><div class="lineage">${html}</div></details>`;
}
function openViewer(src,name){const r=document.createElement('div');r.className='viewer';r.innerHTML=`<div class="top"><b>${esc(name.split('/').pop())}</b><span>${esc(name)}</span><button class="btn x">Close (Esc)</button></div><div class="stage"><img src="${src}" alt=""></div>`;r.querySelector('.x').onclick=()=>r.remove();r.onclick=e=>{if(e.target===r||e.target.classList.contains('stage'))r.remove()};document.body.appendChild(r)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.viewer')?.remove()});
// ---- attachments ----
function addAttachment(pid,ref){
  if(!currentThread){alert('Open a thread first');return}
  if(pid!==currentThread.project_id){alert('That file belongs to another project');return}
  if(!attachments.includes(ref))attachments.push(ref);renderChips();$('#text').focus();
}
function renderChips(){
  const c=$('#chips');c.innerHTML='';const pid=currentThread?.project_id;
  attachments.forEach((ref,i)=>{const {path,version}=splitRef(ref);const d=document.createElement('div');d.className='achip';
    d.innerHTML=`<img src="${rawUrl(pid,path,null,version)}" alt=""><span title="${esc(ref)}">${esc(path.split('/').pop())}${version?` <i style="color:var(--dim)">v${version}</i>`:''}</span><button title="Remove">${ic('i-x','s')}</button>`;
    d.querySelector('button').onclick=()=>{attachments.splice(i,1);renderChips()};c.appendChild(d)});
}
function uploadFiles(files){
  const pid=shownProjectId();if(!pid){alert('Select a project first');return}
  for(const f of files){if(!/^image\//.test(f.type))continue;const r=new FileReader();r.onload=()=>send({type:'upload',projectId:pid,name:f.name||'pasted.png',data:String(r.result).split(',')[1],mimeType:f.type});r.readAsDataURL(f)}
}
const box=$('#box');
box.addEventListener('dragover',e=>{e.preventDefault();box.classList.add('drop')});box.addEventListener('dragleave',()=>box.classList.remove('drop'));
box.addEventListener('drop',e=>{e.preventDefault();box.classList.remove('drop');if(e.dataTransfer?.files?.length)uploadFiles(e.dataTransfer.files)});
$('#text').addEventListener('paste',e=>{const files=[...(e.clipboardData?.files||[])].filter(f=>/^image\//.test(f.type));if(files.length){e.preventDefault();uploadFiles(files)}});
$('#attach').onclick=()=>$('#filein').click();$('#uploadbtn').onclick=()=>$('#filein').click();$('#filein').onchange=()=>{uploadFiles($('#filein').files);$('#filein').value=''};
// ---- seen ----
let seenTimer=null;
function markSeen(){if(!currentThreadId||document.visibilityState!=='visible')return;clearTimeout(seenTimer);seenTimer=setTimeout(()=>{if(currentThreadId)send({type:'seen',threadId:currentThreadId})},300)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&currentThread?.unread)markSeen()});
// ---- socket ----
function onMsg(m){
  switch(m.type){
    case 'hello':{projects.clear();for(const p of m.projects||[])projects.set(p.id,p);threads.clear();for(const t of m.threads||[])threads.set(t.id,t);renderProjects();
      const q=new URLSearchParams(location.search).get('thread');const target=(q&&threads.has(q))?q:(currentThreadId&&threads.has(currentThreadId)?currentThreadId:null);if(target)openThread(target);else setControls();break}
    case 'opened':showThread(m.thread,m.events||[],m.queue||[]);break;
    case 'thread':threads.set(m.thread.id,m.thread);if(m.thread.id===currentThreadId){currentThread=m.thread;if(m.thread.unread)markSeen()}renderThreads();setControls();break;
    case 'thread_deleted':threads.delete(m.threadId);if(m.threadId===currentThreadId){currentThreadId=null;currentThread=null;resetLog();queue=[];renderQueue();$('#tid').textContent='';history.replaceState(null,'',location.pathname);setControls();refreshFiles()}renderThreads();break;
    case 'project':projects.set(m.project.id,m.project);renderProjects();break;
    case 'project_created':projects.set(m.project.id,m.project);$('#project').value=m.project.id;renderProjects();break;
    case 'project_deleted':projects.delete(m.projectId);renderProjects();break;
    case 'queue':if(m.threadId===currentThreadId){queue=m.items;renderQueue()}break;
    case 'files_changed':if(m.projectId===shownProjectId()){refreshFiles();if(selected&&selected.pid===m.projectId)selectFile(selected.pid,selected.path,selected.sel===selected.manifest?.current?undefined:selected.sel)}break;
    case 'uploaded':if(m.projectId===currentThread?.project_id)addAttachment(m.projectId,m.path+'@'+m.version);break;
    case 'restored':break;
    case 'picked':if(m.projectId===shownProjectId())selectFile(m.projectId,m.path,m.version);break;
    case 'event':if(m.threadId===currentThreadId){renderEvent(m.event);scrollDown()}break;
    case 'error':sys('error: '+m.message);setControls();break;
  }
}
// ---- rendering ----
function el(cls,html){const d=document.createElement('div');d.className=cls;if(html!=null)d.innerHTML=html;log.appendChild(d);return d}
function sys(t){agentEl=null;el('sys',esc(t))}
function agentRow(){const r=el('row',`<span class="avatar agent">${ic('i-sparkles')}</span><div class="body"></div>`);return r.querySelector('.body')}
let curBody=null;const body=()=>{if(!curBody||!curBody.isConnected)curBody=agentRow();return curBody};
function renderEvent(event){
  const p=event.payload||{};
  switch(event.type){
    case 'user_message':{agentEl=null;curBody=null;
      const r=el('row',`<span class="avatar${p.synthetic?' agent':''}">${p.synthetic?ic('i-sparkles'):''}</span><div class="body"><div class="text${p.synthetic?' synthetic':''}">${esc(p.text||'')}</div></div>`);
      if(p.attachments?.length&&currentThread){const a=document.createElement('div');a.className='atts';for(const ref of p.attachments){const {path,version}=splitRef(ref);const im=document.createElement('img');im.src=rawUrl(currentThread.project_id,path,null,version);im.title=ref;im.onclick=()=>selectFile(currentThread.project_id,path,version);a.appendChild(im)}r.querySelector('.body').appendChild(a)}break}
    case 'update':onUpdate(p.update);break;
    case 'permission_request':onPerm(p);break;
    case 'permission_response':onPermResponse(p);break;
    case 'turn_end':agentEl=null;curBody=null;sys('turn ended · '+(p.stopReason||''));break;
    case 'error':agentEl=null;if(p.authRequired)onAuth(p);else sys('error: '+(p.message||''));break;
    case 'sys':sys(p.message||'');break;
  }
}
function content(c){if(!c)return '';if(c.type==='text')return c.text;if(c.type==='diff')return `--- ${c.path}\n${c.oldText??''}\n+++\n${c.newText??''}`;if(c.type==='content')return content(c.content);if(c.type==='terminal')return '[terminal '+c.terminalId+']';return '['+c.type+']'}
function onUpdate(u){
  switch(u.sessionUpdate){
    case 'agent_message_chunk':{if(!agentEl){agentEl=document.createElement('div');agentEl.className='text';body().appendChild(agentEl)}agentEl.textContent+=u.content.type==='text'?u.content.text:`[${u.content.type}]`;break}
    case 'agent_thought_chunk':{let t=body().lastElementChild;if(!t||!t.classList.contains('thought')){t=document.createElement('div');t.className='thought';body().appendChild(t)}if(u.content.type==='text')t.textContent+=u.content.text;agentEl=null;break}
    case 'tool_call':{agentEl=null;const prev=tools.get(u.toolCallId);if(prev){renderTool(prev,u);break}
      const d=document.createElement('details');d.className='tool';d.innerHTML=`<summary>${ic('i-right','s chev')}<span class="dot ${u.status??'pending'}"></span><b>${esc(u.title)}</b><span class="k">${esc(u.kind??'')}</span></summary><pre></pre>`;body().appendChild(d);tools.set(u.toolCallId,d);renderTool(d,u);break}
    case 'tool_call_update':{const d=tools.get(u.toolCallId);if(d)renderTool(d,u);break}
    case 'plan':{agentEl=null;if(!planEl||!planEl.isConnected){planEl=document.createElement('div');planEl.className='card plan';body().appendChild(planEl)}
      const done=u.entries.filter(e=>e.status==='completed').length;planEl.innerHTML=`<div class="ch">${ic('i-list')}<b>Plan</b><span style="color:var(--dim)">${done} of ${u.entries.length}</span></div><ul>${u.entries.map(e=>`<li class="${e.status}"><span class="dot ${e.status==='completed'?'completed':e.status}"></span><span>${esc(e.content)}</span></li>`).join('')}</ul>`;break}
    case 'user_message_chunk':case 'available_commands_update':break;
    default:sys(u.sessionUpdate+(u.currentModeId?' → '+u.currentModeId:''));
  }
}
function renderTool(d,u){
  if(u.status)d.querySelector('.dot').className='dot '+u.status;if(u.title)d.querySelector('b').textContent=u.title;
  const pre=d.querySelector('pre');const parts=[];
  if(u.rawInput)parts.push(JSON.stringify(u.rawInput,null,1));if(u.content?.length)parts.push(u.content.map(content).join('\n'));if(u.rawOutput&&!u.content?.length)parts.push(typeof u.rawOutput==='string'?u.rawOutput:JSON.stringify(u.rawOutput,null,1));
  if(parts.length)pre.textContent=parts.join('\n\n').slice(0,6000);
  for(const c of u.content??[]){const img=c.type==='image'?c:(c.type==='content'&&c.content?.type==='image')?c.content:null;if(!img?.data)continue;const key=img.data.slice(0,64);if(d.querySelector(`img[data-key="${key}"]`))continue;
    const im=document.createElement('img');im.dataset.key=key;im.src=`data:${img.mimeType??'image/png'};base64,${img.data}`;im.className='toolimg';im.onclick=()=>openViewer(im.src,u.title||'image');d.appendChild(im);d.open=true}
}
function onPerm(m){agentEl=null;
  const d=document.createElement('div');d.className='ask';d.innerHTML=`<div class="ch">${ic('i-hand')}Needs your call<span style="margin-left:auto;color:var(--dim);font-weight:400">${esc(m.toolCall?.kind??'')}</span></div><div class="cb"><div>${esc(m.toolCall?.title??'tool call')}</div><pre>${esc(JSON.stringify(m.toolCall?.rawInput??{},null,1)).slice(0,1500)}</pre><div class="opts"></div></div>`;
  const opts=d.querySelector('.opts');perms.set(m.id,d);
  for(const o of m.options){const b=document.createElement('button');b.className='btn'+(o.kind.startsWith('allow')?' primary':'');b.textContent=o.name;b.onclick=()=>send({type:'permission_response',id:m.id,optionId:o.optionId,threadId:currentThreadId});opts.appendChild(b)}
  body().appendChild(d);
}
function onPermResponse(m){const d=perms.get(m.id);if(!d)return;d.querySelector('.opts').innerHTML=`<span class="ans">→ ${esc(m.name||'cancelled')}${m.late?' (answered after a restart; delivered as a follow-up)':''}</span>`}
function onAuth(p){curBody=null;
  const cmd=p.agent==='claude'?'claude /login':'codex login';
  const d=el('auth',`<div class="ch">${ic('i-alert')}${esc(p.message||'Not logged in')}</div><div class="cb" style="padding:12px;display:flex;flex-direction:column;gap:10px"><div>${esc(AGENT[p.agent]||'The agent')} needs a login. In a terminal run <code>${cmd}</code>, then retry. Your message is still queued.</div>${p.methods?.length?`<div style="font-size:11.5px;color:var(--mute)">${p.methods.map(m=>esc(m.name)+(m.description?' — '+esc(m.description):'')).join('<br>')}</div>`:''}<div class="opts"><button class="btn primary">Retry</button></div></div>`);
  d.querySelector('button').onclick=()=>{send({type:'retry',threadId:currentThreadId});d.querySelector('.opts').innerHTML='<span class="ans">retrying…</span>'};
}
// ---- actions ----
function connect(){
  sock=new WebSocket(`ws://${location.host}/ws`);
  sock.onopen=()=>{$('#ws').className='dot completed';$('#ws').title='connected'};
  sock.onclose=()=>{$('#ws').className='dot failed';$('#ws').title='disconnected, retrying';setControls();setTimeout(connect,1000)};
  sock.onmessage=e=>onMsg(JSON.parse(e.data));
}
$('#new').onclick=()=>{const projectId=$('#project').value;if(!projectId)return alert('Create a project first');send({type:'new_thread',agent:$('#agent').value,projectId})};
$('#newproject').onclick=()=>{const name=prompt('Project name');if(!name||!name.trim())return;const path=prompt('Absolute folder path (leave empty for a folder under the workspace)')||'';send({type:'new_project',name:name.trim(),...(path.trim()&&{path:path.trim()})})};
$('#project').onchange=()=>{if(!currentThread){selected=null;renderInspect();refreshFiles()}};
$('#cancel').onclick=()=>{if(currentThreadId)send({type:'cancel',threadId:currentThreadId})};
$('#del').onclick=()=>{if(currentThreadId&&confirm('Delete this thread?'))send({type:'delete_thread',threadId:currentThreadId})};
function submit(mode){const t=$('#text').value.trim();if((!t&&!attachments.length)||!currentThread)return;$('#text').value='';agentEl=null;send({type:'prompt',threadId:currentThread.id,text:t||'(see attached image)',mode,attachments:attachments.slice()});attachments=[];renderChips()}
$('#send').onclick=()=>submit(isBusy(currentThread)?'queue':'auto');$('#now').onclick=()=>submit('now');
$('#text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit(isBusy(currentThread)?'queue':'auto')}};
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();$('#new').click()}});
connect();
</script>
</body></html>
